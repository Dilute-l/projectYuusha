<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>候选人生成器 · Yuusha</title>
<style>
  :root { --ink:#1c1a17; --line:#d8d2c6; --bg:#f6f3ec; --card:#fffdf8; --accent:#8a6a3b; }
  * { box-sizing:border-box; }
  body { margin:0; font:14px/1.6 "Microsoft YaHei","PingFang SC",system-ui,sans-serif;
         background:var(--bg); color:var(--ink); }
  header { padding:12px 20px; background:var(--card); border-bottom:1px solid var(--line);
           display:flex; gap:10px; align-items:center; flex-wrap:wrap; position:sticky; top:0; z-index:5; }
  header h1 { font-size:16px; margin:0 10px 0 0; }
  main { display:grid; grid-template-columns:minmax(560px,1.35fr) minmax(340px,1fr); }
  .pane { overflow:auto; padding:16px 20px; height:calc(100vh - 56px); }
  .pane + .pane { border-left:1px solid var(--line); background:#fbf9f4; }
  fieldset { border:1px solid var(--line); border-radius:6px; background:var(--card);
             margin:0 0 14px; padding:10px 12px 12px; }
  legend { font-weight:700; padding:0 6px; color:var(--accent); }
  label { display:block; font-size:12px; color:#6b6357; margin:8px 0 2px; }
  input[type=text], input[type=number], textarea, select {
    width:100%; padding:6px 8px; border:1px solid var(--line); border-radius:4px;
    background:#fff; font:inherit; color:inherit; }
  textarea { resize:vertical; min-height:50px; }
  button { font:inherit; padding:5px 11px; border:1px solid var(--line); border-radius:4px;
           background:var(--card); cursor:pointer; }
  button:hover { background:#f0ebe1; }
  button.primary { background:var(--accent); color:#fff; border-color:var(--accent); }
  button.tiny { padding:2px 7px; font-size:12px; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:0 12px; }
  .row { display:flex; gap:8px; align-items:center; }
  .row > * { flex:1; } .row > button { flex:0 0 auto; }
  .card { border:1px solid var(--line); border-radius:6px; background:var(--card); margin-bottom:12px; }
  .card > .head { display:flex; gap:8px; align-items:center; padding:7px 10px;
                  border-bottom:1px solid var(--line); background:#f3efe6; border-radius:6px 6px 0 0; }
  .card > .head b { flex:1; }
  .body { padding:10px 12px; }
  .hint { color:#8b8375; font-size:12px; margin:4px 0 0; }
  .warn { color:#a33; } .ok { color:#3a7a3a; }
  pre { margin:0 0 12px; padding:10px 12px; background:#2c2a26; color:#f2eee6; border-radius:6px;
        font:12px/1.5 Consolas,"Cascadia Mono",monospace; white-space:pre; overflow:auto; max-height:46vh; }
  .files { list-style:none; margin:0 0 12px; padding:0; }
  .files li { display:flex; gap:8px; align-items:center; padding:4px 0; border-bottom:1px dashed var(--line); }
  .files li span { flex:1; font-family:Consolas,monospace; font-size:12px; }
  .tabs { display:flex; gap:4px; margin-bottom:10px; flex-wrap:wrap; }
  .tabs button.on { background:var(--accent); color:#fff; border-color:var(--accent); }
</style>
</head>
<body>
<header>
  <h1>候选人生成器</h1>
  <button class="primary" id="add">+ 新增候选人</button>
  <button id="dup">复制当前</button>
  <button id="del">删除当前</button>
  <button id="loadFiles">读取 .tres / json…</button>
  <button id="loadDir" hidden>从 data/ 读取…</button>
  <input type="file" id="filePicker" accept=".tres,.res,.json,.txt" multiple hidden>
  <button id="saveDir" hidden>全部写入 data/…</button>
  <span id="msg" class="hint"></span>
</header>

<main>
  <div class="pane" id="form"></div>
  <div class="pane">
    <div class="tabs" id="tabs"></div>
    <ul class="files" id="files"></ul>
    <div class="row" style="margin-bottom:10px">
      <button id="dlOne">下载当前 .tres</button>
      <button id="dlJson">下载当前的所有 json</button>
    </div>
    <pre id="out"></pre>
  </div>
</main>

<script>
"use strict";
/* ─────────────────────────────────────────────────────────────────────────
   候选人生成器 —— 单文件、零依赖。
   产出一位候选人的：
     data/candidates/<id>.tres        CandidateResource
     data/asks/<id>_1..N.json         履历 / 专长 每条的追问对话（扁平序号）
     data/asks/<id>_status.json       属性追问（序号 -1）
   序号约定与 resume.gd::ask_path_of() 一致：experience 在前，skill 接着发。

   简历印章：`.tres` 里的 resume_stamp 由下面的 STAMP_DIR / STAMPS 拼出来，
   选「（不盖章）」就**不写这一行** —— CandidateResource.resume_stamp 默认是 null，
   不写就是不盖（resume.gd::_apply_stamp 的规则，见 ARCHITECTURE.md §10.6）。

   属性有两个数：力量 / 智力 / 感知那三栏是**简历上写的**（他自称的），
   「真实属性」那三栏是**真正进结算的**。后者只在「和简历不一样」时才填 ——
   留空表示实际 = 简历，.tres 里连 true_attributes 这一行都不写
   （ARCHITECTURE.md §3.1）。

   等级（level）是**隐藏属性**：照写进 .tres，但不上简历纸，也没有「简历值 / 实际值」两说。

   牌子印章：每行的追问对话可以多写一个 popup_stamp 键（值 = POPUP_STAMP_NAMES 里的名字），
   盖在对话小牌子（Popup.tscn）上 —— 和简历那枚**共用同一批图**，
   但由**台词**决定盖不盖、盖哪张（dialogue_generator.html 里是同一个下拉）。

   反过来也读得回来：「读取 .tres / json…」把一份已经存在的候选人拆回这个表单接着改
   （解析在下面的「读取」一节）。**台词住在 asks/*.json 里、不在 .tres 里** ——
   只选 .tres 就读不到台词，那几条的 json 会被标成「没读进来」，写回时**跳过**，
   免得用空台词把人家真写的对话盖掉。想连台词一起读：把同一个人的 json 一并选上，
   或者用「从 data/ 读取…」整个目录读（Chromium）。
   ───────────────────────────────────────────────────────────────────────── */

const SCRIPTS = {
  candidate: "res://scripts/resources/candidate_resource.gd",
  entry:     "res://scripts/resources/resume_entry.gd",
  trait:     "res://scripts/resources/trait_def.gd",
};
const RACES = ["dwarf", "elf", "human"];      // data/races/*.tres
const JOBS  = ["cleric", "fighter", "mage"];  // data/jobs/*.tres
const PORTRAIT_RACES = ["hu", "el", "st"];    // 立绘配方代号（hu 人 / el 精灵 / st 矮人）

/* true_attributes 的键。就是力量 / 智力 / 感知那三个字段名，一个不多一个不少 ——
   键名对不上时 Godot 那边会当「没写这项」处理（CandidateResource.true_attribute），
   不报错、静默照简历走，所以这里写死短名单，别让人手打。 */
const ATTR_KEYS = ["strength", "intelligence", "wisdom"];
const ATTR_LABELS = { strength: "真实力量", intelligence: "真实智力", wisdom: "真实感知" };

/* 简历印章。加一张新章 = 把 .png 丢进 STAMP_DIR，再把**文件名（不带扩展名）**加进 STAMPS。
   和上面 RACES / JOBS 一样是写死的短名单 —— 手打路径打错的话，Godot 载入时只会
   静默少一个 ext_resource（纸上不盖章），很难查。 */
const STAMP_DIR = "res://assets/art/interview/resume/stamp/";
const STAMPS = ["resume_stamp_real", "resume_stamp_fake1", "resume_stamp_fake2",
                "resume_stamp_fake3", "resume_stamp_fake4"];

/* 牌子印章（对话 json 的 popup_stamp 键）——和简历那枚**同一批图**，但短名单各写一份：
   两边读的是同一个目录，但「简历上能盖哪些章」和「牌子上能盖哪些章」是两件事，将来可能分开。
   ⚠️ 三处要一起加：这里 + popup.gd 的 STAMP_NAMES + dialogue_generator.html 的 STAMP_NAMES。 */
const POPUP_STAMP_NAMES = STAMPS;
const STAMP_NONE = "none";   // 哨兵：这一句明确不盖章（与「不写这个键」不同，见 §10.6）

const $ = (s) => document.querySelector(s);
const el = (tag, props = {}, kids = []) => {
  const n = Object.assign(document.createElement(tag), props);
  for (const k of [].concat(kids)) if (k) n.appendChild(k);
  return n;
};

// ── 数据 ────────────────────────────────────────────────────────────────────
function blankCandidate(n) {
  return {
    id: "c_" + String(n).padStart(4, "0"),
    display_name: "", strength: 10, intelligence: 10, wisdom: 10,
    level: 1,                         // 等级：**隐藏属性**，不上简历纸（CandidateResource.level）
    // 真实属性：只有「和简历不一样」的那几项才填，"" = 与简历一致。
    // 界面上是三个独立的框 —— 它们各自对应 .tres 里那个字典的一项。
    true_attributes: { strength: "", intelligence: "", wisdom: "" },
    race: "human", job: "fighter", gender: "男", age: 20,
    traits: "",                       // 逗号分隔的 data/traits/*.tres 文件名
    portrait_race: "hu", portrait_eye: 1, portrait_hair: 1, portrait_mouth: 1, portrait_hat: 1,
    resume_stamp: "",                 // "" = 不盖章；否则是 STAMPS 里的一个文件名（不带 .png）
    team_declaration: "", judgment: "",
    experience: [blankEntry()],
    skill: [blankEntry()],
    statusLines: [blankLine(), blankLine()],
    // 属性追问的台词读进来没有。**只有 import 出来的人才可能为 false**：
    // 那时写回会**跳过** <id>_status.json，不然会用两行空台词盖掉人家真写的对话。
    statusLoaded: true,
  };
}
function blankEntry() { return { description: "", lines: [blankLine(), blankLine()], linesLoaded: true }; }
function blankLine(speaker = "", text = "") { return { speaker, text, popup: "", popupStamp: "" }; }

let candidates = [];
let current = 0;

// ── 渲染 ────────────────────────────────────────────────────────────────────
const on = (fn) => (e) => { fn(e.target.value); refresh(); };

/* 输入时只重画**右边那一栏**（文件列表 / .tres 预览 / id 查重），不重建左边的表单 ——
   重建会把正在打字的那个 input 整个换掉，光标和输入法状态全丢。
   原件里这一句漏写了：每敲一个键都会抛 ReferenceError（值照样存得进去，
   所以「看起来能用」，但控制台一直在刷红）。 */
function refresh() { renderSide(); }

function render() {
  const box = $("#form"); box.textContent = "";
  if (!candidates.length) {
    box.appendChild(el("p", { className: "hint", textContent: "还没有候选人。点左上「+ 新增候选人」，或用「读取 .tres / json…」读一位已经存在的进来改。" }));
    renderSide(); return;
  }
  const c = candidates[current];

  // 基本信息
  const basic = el("div", { className: "grid" });
  const field = (label, value, setter, type = "text") => {
    const wrap = el("div");
    wrap.appendChild(el("label", { textContent: label }));
    wrap.appendChild(el("input", { type, value, oninput: on(setter) }));
    return wrap;
  };
  basic.append(
    field("id（c_0001）", c.id, (v) => c.id = v.trim()),
    field("姓名 display_name", c.display_name, (v) => c.display_name = v),
    field("等级 level（隐藏，不上简历纸）", c.level, (v) => c.level = intOf(v), "number"),
    field("力量 strength（简历上写的）", c.strength, (v) => c.strength = intOf(v), "number"),
    field("智力 intelligence（简历上写的）", c.intelligence, (v) => c.intelligence = intOf(v), "number"),
    field("感知 wisdom（简历上写的）", c.wisdom, (v) => c.wisdom = intOf(v), "number"),
    trueAttrField(c, "strength"),
    trueAttrField(c, "intelligence"),
    trueAttrField(c, "wisdom"),
    field("年龄", c.age, (v) => c.age = intOf(v), "number"),
  );
  // 一个横跨整行的说明：上面那三栏「真实…」是本工具最容易填错的地方
  basic.appendChild(el("p", { className: "hint", style: "grid-column:1/-1",
    textContent: "真实属性 = 结算实际用的值（true_attributes）。留空 = 与简历一致，"
      + "生成的 .tres 里连这一行都不写；只有和简历不一样的那几项才填。" }));
  const sel = (label, value, setter, options) => {
    const wrap = el("div");
    wrap.appendChild(el("label", { textContent: label }));
    const s = el("select", { onchange: on(setter) });
    // 读进来的文件里可能是名单外的值（新职业 / 新种族…）：给它补一个选项。
    // 不补的话下拉框会**显示成第一个选项**，看着像数据已经被改了 —— 实际没改，更吓人。
    const known = options.includes(value);
    const list = known ? options : [value, ...options];
    for (const o of list) {
      const extra = o === value && !known;
      const text = extra ? (o === "" ? "（空 · 原文件里的值不在名单里）" : o + "（不在名单里）") : o;
      s.appendChild(el("option", { value: o, textContent: text, selected: o === value }));
    }
    wrap.appendChild(s); return wrap;
  };
  basic.append(
    sel("种族 race（data/races/）", c.race, (v) => c.race = v, RACES),
    sel("职业 job（data/jobs/）", c.job, (v) => c.job = v, JOBS),
    sel("性别 gender", c.gender, (v) => c.gender = v, ["男", "女"]),
    sel("立绘种族 portrait_race", c.portrait_race, (v) => c.portrait_race = v, PORTRAIT_RACES),
  );
  basic.appendChild(field("portrait_eye", c.portrait_eye, (v) => c.portrait_eye = intOf(v), "number"));
  basic.appendChild(field("portrait_hair", c.portrait_hair, (v) => c.portrait_hair = intOf(v), "number"));
  basic.appendChild(field("portrait_mouth", c.portrait_mouth, (v) => c.portrait_mouth = intOf(v), "number"));
  basic.appendChild(field("portrait_hat", c.portrait_hat, (v) => c.portrait_hat = intOf(v), "number"));
  basic.appendChild(stampField(c));
  basic.appendChild(field("特质 traits（逗号分隔，例如 hot_blooded,greedy）", c.traits, (v) => c.traits = v));

  const fsBasic = el("fieldset", {}, [el("legend", { textContent: "基本信息" }), basic]);
  box.appendChild(fsBasic);

  // 宣言 / 评价
  const area = (label, value, setter) => {
    const wrap = el("div");
    wrap.appendChild(el("label", { textContent: label }));
    wrap.appendChild(el("textarea", { value, oninput: on(setter) }));
    return wrap;
  };
  box.appendChild(el("fieldset", {}, [
    el("legend", { textContent: "文案" }),
    area("组队宣言 team_declaration", c.team_declaration, (v) => c.team_declaration = v),
    area("战报评价 judgment", c.judgment, (v) => c.judgment = v),
  ]));

  // 履历 / 专长
  box.appendChild(entryFieldset(c, "experience", "个人履历与奖项 experience"));
  box.appendChild(entryFieldset(c, "skill", "专长 skill"));

  // 属性追问
  const statusCard = el("div", { className: "card" }, [
    el("div", { className: "head" }, [
      el("b", { textContent: "属性追问  <id>_status.json（序号 -1）" }),
      el("button", { className: "tiny", textContent: "+ 行", onclick: () => { c.statusLines.push(blankLine()); render(); } }),
    ]),
  ]);
  const sb = el("div", { className: "body" });
  c.statusLines.forEach((ln, i) => sb.appendChild(lineEditor(ln, c.statusLines, i)));
  statusCard.appendChild(sb);
  box.appendChild(el("fieldset", {}, [el("legend", { textContent: "状态区追问" }), statusCard]));

  renderSide();
}

function intOf(v) { const n = parseInt(v, 10); return Number.isNaN(n) ? 0 : n; }

/* 「真实属性」输入框。**留空 = 与简历一致** —— 也就是不写 true_attributes 的这一项。
   三项都留空就整行都不写，所以「没撒谎」的候选人生成出来与老生成器逐个字节一致。 */
function trueAttrField(c, key) {
  const wrap = el("div");
  wrap.appendChild(el("label", { textContent: ATTR_LABELS[key] + "（true_attributes." + key + "）" }));
  wrap.appendChild(el("input", { type: "number", value: c.true_attributes[key],
    placeholder: "留空 = 与简历一致",
    oninput: on((v) => c.true_attributes[key] = v.trim()) }));
  return wrap;
}

/* 简历印章选单。空值 = 不盖章（.tres 里那一行都不写）。 */
function stampField(c) {
  const wrap = el("div");
  wrap.appendChild(el("label", { textContent: "简历印章 resume_stamp" }));
  const s = el("select", { onchange: on((v) => c.resume_stamp = v) });
  s.appendChild(el("option", { value: "", textContent: "（不盖章）", selected: !c.resume_stamp }));
  // 读进来的文件可能盖着一张不在 STAMPS 里的章（新章还没加进短名单）：照样列出来，
  // 否则下拉框显示「不盖章」而数据里还留着它 —— 看着像章被删了。
  const names = c.resume_stamp && !STAMPS.includes(c.resume_stamp) ? [c.resume_stamp, ...STAMPS] : STAMPS;
  for (const name of names) {
    const extra = name === c.resume_stamp && !STAMPS.includes(name);
    s.appendChild(el("option", { value: name, textContent: extra ? name + "（不在名单里）" : name, selected: name === c.resume_stamp }));
  }
  wrap.appendChild(s);
  wrap.appendChild(el("p", { className: "hint",
    textContent: c.resume_stamp ? "→ " + stampPath(c.resume_stamp) : "留空 = 这张简历上不盖章" }));
  return wrap;
}

function entryFieldset(c, key, legend) {
  const list = c[key];
  const card = el("div", { className: "card" }, [
    el("div", { className: "head" }, [
      el("b", { textContent: legend + "（" + list.length + " 条）" }),
      el("button", { className: "tiny", textContent: "+ 条", onclick: () => { list.push(blankEntry()); render(); } }),
    ]),
  ]);
  const body = el("div", { className: "body" });
  list.forEach((entry, i) => {
    const head = el("div", { className: "row" }, [
      el("input", { type: "text", value: entry.description, placeholder: "履历正文",
        oninput: on((v) => entry.description = v) }),
      el("button", { className: "tiny", textContent: "删条", onclick: () => { list.splice(i, 1); render(); } }),
    ]);
    const inner = el("div", {}, [head]);
    entry.lines.forEach((ln, li) => inner.appendChild(lineEditor(ln, entry.lines, li)));
    inner.appendChild(el("button", { className: "tiny", textContent: "+ 行", onclick: () => { entry.lines.push(blankLine()); render(); } }));
    body.appendChild(el("div", { className: "card", style: "margin:8px 0" }, [el("div", { className: "body" }, [inner])]));
  });
  card.appendChild(body);
  return el("fieldset", {}, [el("legend", { textContent: legend }), card]);
}

function lineEditor(ln, arr, i) {
  // 印章下拉：只有这一行真的弹牌子（popup 非空）时才亮 —— 牌子都没亮，章无处可盖。
  const stampSel = el("select", {
    title: "popup_stamp：这一句牌子上盖哪枚章（" + STAMP_DIR + "）",
    style: "flex:0 0 150px",
    onchange: (e) => { ln.popupStamp = e.target.value; refresh(); },
  }, [
    el("option", { value: "", textContent: "印章：跟随上一句", selected: !ln.popupStamp }),
    el("option", { value: STAMP_NONE, textContent: "印章：明确不盖", selected: ln.popupStamp === STAMP_NONE }),
    ...POPUP_STAMP_NAMES.map((n) => el("option", {
      value: n, textContent: "印章：" + n, selected: ln.popupStamp === n,
    })),
  ]);
  stampSel.disabled = ln.popup.trim() === "";

  return el("div", { className: "row", style: "margin:4px 0" }, [
    el("input", { type: "text", value: ln.speaker, placeholder: "说话人",
      oninput: on((v) => ln.speaker = v) }),
    el("input", { type: "text", value: ln.text, placeholder: "正文",
      oninput: on((v) => ln.text = v) }),
    // ⚠️ 这里**不能**调 render()：那会重建整个表单，把正在打字的这个 input 换掉 ——
    //    焦点、光标位置、中文输入法的候选状态全丢，表现就是「每敲一个字卡一下」。
    //    popup 空不空只影响印章下拉的置灰状态，直接改那一个节点就够了。
    el("input", { type: "text", value: ln.popup, placeholder: "popup（可空）", style: "flex:0 0 130px",
      oninput: (e) => {
        ln.popup = e.target.value;
        const off = ln.popup.trim() === "";
        // 没弹牌子 = 用不上印章，顺手清掉，免得 json 里留一个永远不会被读的键
        if (off) ln.popupStamp = "";
        stampSel.disabled = off;
        if (off) stampSel.value = "";
        refresh();
      } }),
    stampSel,
    el("button", { className: "tiny", textContent: "删", onclick: () => { arr.splice(i, 1); render(); } }),
  ]);
}

// ── 读取（.tres / json → 编辑器数据）────────────────────────────────────────
//
// 这个工具原本只会**写**：手填一位新人 → 吐出 .tres + 追问 json。
// 现在它也会**读**：把一份已经存在的 data/candidates/*.tres 拆回编辑器的形状，
// 改完再写回去。所以下面这一节是「反向的 buildTres」。
//
// ⚠️ 解析写成**纯函数**（不碰 DOM），因为它要面对的是 26 份**由 Godot 存出来的**真文件，
//    和我们自己生成的那份不完全一样：
//      · 属性顺序随 Godot 的存盘顺序（不是我们写出去的那个顺序）；
//      · ext_resource 带 uid=，头部也有 uid=；
//      · 等于默认值的属性**整行没有**（没写 strength 就是 0，不是模板里的 10）；
//      · 字典 / 数组可能被 Godot 折成多行；
//      · String 与 StringName 混用（"男" 与 &"男"）。
//    所以这里不按行正则硬切，而是「扫 `键 = 值`，值允许跨行、按括号深度断句」。

/* 只认这些**资源默认值**：文件里没写的键，就是 Godot 的资源默认值，不是本工具模板里的占位。
   （模板里 strength 默认 10 / portrait_eye 默认 1，那是「新增一位」时的方便值。） */
const RES_DEFAULTS = {
  level: 1, strength: 0, intelligence: 0, wisdom: 0, age: 2,
  gender: "男", portrait_race: "hu",
  portrait_eye: 101, portrait_hair: 101, portrait_mouth: 101, portrait_hat: 0,
};

function basenameOf(p) { return String(p).split("/").pop(); }
function stripExtOf(name) { return String(name).replace(/\.[^.]+$/, ""); }

/* .tres 里的字符串字面量 → JS 字符串。\n \t \" \\ 一次过解掉（不来回解，免得 \\n 被吃两次）。 */
function unescapeTres(s) {
  return String(s).replace(/\\(.)/g, (m, ch) => (ch === "n" ? "\n" : ch === "t" ? "\t" : ch));
}

/* "abc" / &"abc" / 42 / null → 字符串（& 前缀是 StringName，读起来和 String 一样） */
function tresString(raw) {
  if (raw === undefined || raw === null) return "";
  let s = String(raw).trim();
  if (s === "null" || s === "") return "";
  if (s[0] === "&") s = s.slice(1).trim();
  if (s.length >= 2 && s[0] === '"' && s[s.length - 1] === '"') return unescapeTres(s.slice(1, -1));
  return s;
}

function tresInt(raw, dflt = 0) {
  const n = parseInt(String(raw === undefined || raw === null ? "" : raw).trim(), 10);
  return Number.isNaN(n) ? dflt : n;
}

/* ExtResource("1_x") / SubResource("Resource_e0") → 那个 id */
function tresRefId(raw) {
  const m = String(raw || "").match(/(?:Ext|Sub)Resource\("([^"]+)"\)/);
  return m ? m[1] : "";
}

/* Array[ExtResource("…")]([a, b]) → [a, b]
   ⚠️ 只看 `](` **后面**那截：`Array[...]` 里的那个 ExtResource("…") 是**元素类型**（脚本），
      不是内容 —— 早先按全文抓引用的话，traits 会凭空多出一个 trait_def.gd。 */
function tresArrayRefs(raw) {
  const s = String(raw || "");
  const cut = s.indexOf("](");
  const scope = cut >= 0 ? s.slice(cut + 2) : s;
  return [...scope.matchAll(/(?:Ext|Sub)Resource\("([^"]+)"\)/g)].map((m) => m[1]);
}

/* { "strength": 4, &"wisdom": 12 } → { strength: 4, wisdom: 12 }（键的两种写法都认） */
function tresDict(raw) {
  const out = {};
  for (const m of String(raw || "").matchAll(/&?"([^"]+)"\s*:\s*(-?[\d.]+)/g)) out[m[1]] = parseInt(m[2], 10);
  return out;
}

/* 一份 .tres 的正文 → { ext: {id: path}, subs: {id: {键: 原样值}}, res: {键: 原样值}}
   段的切法：`[xxx …]` 起一段，段里的行归它；ext_resource 是自带属性的单行段。 */
function parseTresSections(text) {
  const ext = {}, subs = {};
  let res = {};
  let cur = null;
  const attrOf = (attrs, name) => {
    // ⚠️ 必须要求属性名前面有空白：不然找 `id="…"` 会先撞上 `uid="…"` 里的那截
    //    ——「uid://cd7wsjw4cuvnq」会被当成 id 读走，于是 job / resume_stamp 这些
    //    带 uid 的 ext_resource 全部解析成空。这不是理论问题，是自检当场抓出来的。
    const m = attrs.match(new RegExp('\\s' + name + '="([^"]*)"'));
    return m ? m[1] : "";
  };
  const flush = () => {
    if (!cur) return;
    const props = parseTresProps(cur.lines.join("\n"));
    if (cur.kind === "sub") subs[cur.id] = props;
    else res = props;
    cur = null;
  };
  for (const line of String(text).split(/\r?\n/)) {
    const head = line.match(/^\[([a-z_]+)\s*(.*)\]\s*$/);
    if (head) {
      flush();
      if (head[1] === "ext_resource") {
        const id = attrOf(head[2], "id");
        if (id) ext[id] = attrOf(head[2], "path");
      } else if (head[1] === "sub_resource") {
        cur = { kind: "sub", id: attrOf(head[2], "id"), lines: [] };
      } else if (head[1] === "resource") {
        cur = { kind: "res", id: "", lines: [] };
      }
      continue;   // gd_resource 头 / 不认识的段（以后的 metadata 之类）直接跳过
    }
    if (cur) cur.lines.push(line);
  }
  flush();
  return { ext, subs, res };
}

/* 一段正文 → { 键: 原样值 }。值可以跨行：靠括号深度 + 字符串状态判断「这一口气完了没有」。 */
function parseTresProps(body) {
  const props = {};
  let i = 0;
  const n = body.length;
  const isSpace = (ch) => ch === " " || ch === "\t" || ch === "\r" || ch === "\n";
  while (i < n) {
    while (i < n && isSpace(body[i])) i++;
    if (i >= n) break;
    const eq = body.indexOf("=", i);
    if (eq < 0) break;
    const key = body.slice(i, eq).trim();
    i = eq + 1;
    while (i < n && (body[i] === " " || body[i] === "\t")) i++;
    const start = i;
    let depth = 0, inStr = false, escaped = false;
    while (i < n) {
      const ch = body[i];
      if (inStr) {
        if (escaped) escaped = false;
        else if (ch === "\\") escaped = true;
        else if (ch === '"') inStr = false;
      } else if (ch === '"') {
        inStr = true;
      } else if (ch === "(" || ch === "[" || ch === "{") {
        depth++;
      } else if (ch === ")" || ch === "]" || ch === "}") {
        depth--;
      } else if (ch === "\n" && depth === 0) {
        break;
      }
      i++;
    }
    props[key] = body.slice(start, i).trim();
  }
  return props;
}

/* ext_resource 的路径 → 短名单里的名字（.../data/jobs/fighter.tres → fighter） */
function nameInFolder(path, folder) {
  const m = String(path || "").match(new RegExp("/" + folder + "/([^/]+)\\.tres$"));
  return m ? m[1] : "";
}

/* 一份 data/candidates/*.tres 的正文 → 编辑器里那位候选人的数据。不像候选人文件则返回 null。 */
function parseTres(text) {
  const { ext, subs, res } = parseTresSections(text);
  const extPath = (raw) => ext[tresRefId(raw)] || "";
  if (!res.id && !("display_name" in res) && !("strength" in res)) return null;

  const attrs = tresDict(res.true_attributes);
  const trueAttrs = { strength: "", intelligence: "", wisdom: "" };
  for (const k of ATTR_KEYS) if (attrs[k] !== undefined) trueAttrs[k] = String(attrs[k]);

  const c = {
    id: tresString(res.id),
    display_name: tresString(res.display_name),
    level: tresInt(res.level, RES_DEFAULTS.level),
    strength: tresInt(res.strength, RES_DEFAULTS.strength),
    intelligence: tresInt(res.intelligence, RES_DEFAULTS.intelligence),
    wisdom: tresInt(res.wisdom, RES_DEFAULTS.wisdom),
    true_attributes: trueAttrs,
    race: nameInFolder(extPath(res.race), "races"),
    job: nameInFolder(extPath(res.job), "jobs"),
    gender: tresString(res.gender) || RES_DEFAULTS.gender,
    age: tresInt(res.age, RES_DEFAULTS.age),
    traits: tresArrayRefs(res.traits).map((id) => nameInFolder(ext[id] || "", "traits")).filter(Boolean).join(","),
    portrait_race: tresString(res.portrait_race) || RES_DEFAULTS.portrait_race,
    portrait_eye: tresInt(res.portrait_eye, RES_DEFAULTS.portrait_eye),
    portrait_hair: tresInt(res.portrait_hair, RES_DEFAULTS.portrait_hair),
    portrait_mouth: tresInt(res.portrait_mouth, RES_DEFAULTS.portrait_mouth),
    portrait_hat: tresInt(res.portrait_hat, RES_DEFAULTS.portrait_hat),
    resume_stamp: stripExtOf(basenameOf(extPath(res.resume_stamp))),
    team_declaration: tresString(res.team_declaration),
    judgment: tresString(res.judgment),
    experience: [],
    skill: [],
    statusLines: [blankLine(), blankLine()],
    statusLoaded: false,          // 没有 <id>_status.json 就一直是 false（写回会跳过它）
  };

  // 词条：sub_resource 里只有「描述 + 追问 json 的路径」，台词住在那个 json 里
  for (const key of ["experience", "skill"]) {
    for (const sid of tresArrayRefs(res[key])) {
      const p = subs[sid] || {};
      const ask = tresString(p.ask_path);
      c[key].push({
        description: tresString(p.description),
        lines: [blankLine(), blankLine()],
        linesLoaded: false,
        askFile: basenameOf(ask),     // 只用来对 json 名字，写回时按序号重排（见 filesFor）
        askPath: ask,
      });
    }
  }
  // 读进来的 ask_path 是不是约定名（<id>_<n>.json）：不是的话写回会改成约定名、旧文件成孤儿，
  // 所以只数一下，交给 importNote 明说。（`_` 开头 = 读取期的记账，不是候选人字段）
  const flat = flatEntries(c);
  c._oddAsks = flat.filter((e, i) => e.askFile !== "" && e.askFile !== c.id + "_" + (i + 1) + ".json").length;
  return c;
}

/* 一份追问 json 的正文 → 行数组；读不动返回 null（调用方据此判定「没读进来」）。 */
function linesFromJson(text) {
  let parsed;
  try { parsed = JSON.parse(text); } catch (e) { return null; }
  if (!Array.isArray(parsed)) return null;
  return parsed.map((o) => {
    const ln = blankLine(String(o.speaker_name || ""), String(o.text || ""));
    ln.popup = String(o.popup || "");
    ln.popupStamp = String(o.popup_stamp || "");
    return ln;
  });
}

/* 把一批 {name, text} 里的 json 贴回这个人的追问台词上。
   ⚠️ 对不上号的**不编造**：那一条的 linesLoaded 停在 false，写回时会跳过它，
      不然「只读 .tres 就写回」会拿两行空台词盖掉人家真写的对话。
   返回没贴上的条数。 */
function attachAsks(c, files) {
  const byName = {};
  for (const f of files) if (f.name.endsWith(".json")) byName[f.name] = f.text;
  let missing = 0;
  flatEntries(c).forEach((e) => {
    const text = e.askFile ? byName[e.askFile] : undefined;
    const lines = text === undefined ? null : linesFromJson(text);
    if (lines) { e.lines = lines; e.linesLoaded = true; } else missing++;
  });
  const statusText = byName[c.id + "_status.json"];
  const statusLines = statusText === undefined ? null : linesFromJson(statusText);
  if (statusLines) { c.statusLines = statusLines; c.statusLoaded = true; } else missing++;
  return missing;
}

/* 读取结果 → 一行给人看的话（附带那些「读不全」的实情，别让人以为读干净了）。 */
function importNote(imported, what) {
  const noLines = imported.filter((c) => !c.statusLoaded
    || flatEntries(c).some((e) => e.linesLoaded === false)).length;
  let note = what + "：" + imported.length + " 位候选人";
  if (noLines) note += "；⚠ 其中 " + noLines + " 位的追问台词没一起读进来 —— 写回会跳过那些 json（不会覆盖）";
  const odd = imported.filter((c) => c._oddAsks > 0).length;
  if (odd) note += "。⚠ 有 " + odd + " 位的 ask_path 不是约定名（<id>_<n>.json）—— 写回会改成约定名，旧文件要自己删";
  return note;
}

// ── 产出 ────────────────────────────────────────────────────────────────────
function flatEntries(c) {
  const out = [];
  for (const e of c.experience) if (e.description.trim() !== "") out.push(e);
  for (const e of c.skill) if (e.description.trim() !== "") out.push(e);
  return out;
}

function askPath(c, i) { return "res://data/asks/" + c.id + "_" + (i + 1) + ".json"; }
function statusPath(c) { return "res://data/asks/" + c.id + "_status.json"; }
function stampPath(name) { return STAMP_DIR + name + ".png"; }

// .tres 里的字符串：转义反斜杠、双引号；换行写成 \n（Godot 两种都收，单行更好 diff）
function q(s) { return '"' + String(s).replace(/\\/g, "\\\\").replace(/"/g, '\\"').replace(/\r?\n/g, "\\n") + '"'; }
function sn(s) { return '&' + q(s); }

function buildTres(c) {
  const L = [];
  // 属性等于 Godot 默认值的也照写 —— 无害，Godot 载入后自己会在下次保存时省掉
  const ext = [];      // [line, key]
  const ids = {};
  const pushExt = (type, path, key) => {
    const id = (ext.length + 1) + "_" + key;
    ext.push('[ext_resource type="' + type + '" path="' + path + '" id="' + id + '"]');
    ids[key] = id;
  };
  pushExt("Script", SCRIPTS.candidate, "script");
  pushExt("Script", SCRIPTS.entry, "entry");
  pushExt("Resource", "res://data/jobs/" + c.job + ".tres", "job");
  pushExt("Resource", "res://data/races/" + c.race + ".tres", "race");
  const traits = c.traits.split(/[,，]/).map((s) => s.trim()).filter(Boolean);
  if (traits.length) pushExt("Script", SCRIPTS.trait, "traitscript");
  const traitIds = traits.map((t, i) => {
    const id = (ext.length + 1) + "_tr" + i;
    ext.push('[ext_resource type="Resource" path="res://data/traits/' + t + '.tres" id="' + id + '"]');
    return id;
  });
  // 印章放在 traits 之后：位置一变，前面那些 ext_resource 的 id 全跟着变，
  // 加在末尾能让「没有章」的候选人 .tres 与老生成器逐个字节一致。
  if (c.resume_stamp) pushExt("Texture2D", stampPath(c.resume_stamp), "stamp");

  // 词条 sub_resource：experience 先、skill 后，序号与扁平序号一致
  const subs = [];
  const subIds = { experience: [], skill: [] };
  let n = 0;
  const all = flatEntries(c);
  for (const key of ["experience", "skill"]) {
    for (const e of c[key]) {
      if (e.description.trim() === "") continue;
      const sid = "Resource_e" + n++;
      subIds[key].push(sid);
      subs.push('[sub_resource type="Resource" id="' + sid + '"]',
                'script = ExtResource("' + ids.entry + '")',
                "description = " + q(e.description),
                "ask_path = " + q(askPath(c, all.indexOf(e))),
                "");
    }
  }

  L.push('[gd_resource type="Resource" script_class="CandidateResource" format=3]', "");
  for (const line of ext) L.push(line);
  L.push("");
  for (const line of subs) L.push(line);
  L.push("[resource]");
  L.push('script = ExtResource("' + ids.script + '")');
  L.push("id = " + sn(c.id));
  L.push("display_name = " + q(c.display_name));
  // 等级：隐藏属性，但**照样写出来** —— 它在 .tres 里看得见（策划要按它配叙事规则），
  // 只是不上简历纸。不写的话就落回默认值 1，看不出「这位是几级」。
  L.push("level = " + c.level);
  L.push("strength = " + c.strength);
  L.push("intelligence = " + c.intelligence);
  L.push("wisdom = " + c.wisdom);
  // true_attributes：**只写真要改的那几项**（键 = 上面那三个字段名）。
  // 一项都没改就**一行都不写** —— 它的默认值就是 {}，写个空字典进去
  // 只会让「没撒谎」的 .tres 与老生成器不一致。
  const attrs = fakedOf(c);
  if (attrs.length) {
    L.push("true_attributes = { " +
           attrs.map((k) => q(k) + ": " + intOf(c.true_attributes[k])).join(", ") + " }");
  }
  L.push('race = ExtResource("' + ids.race + '")');
  L.push('job = ExtResource("' + ids.job + '")');
  L.push("gender = " + sn(c.gender));
  L.push("age = " + c.age);
  if (traitIds.length) {
    L.push("traits = Array[ExtResource(\"" + ids.traitscript + "\")]([" +
           traitIds.map((t) => 'ExtResource("' + t + '")').join(", ") + "])");
  }
  for (const key of ["experience", "skill"]) {
    L.push(key + " = Array[ExtResource(\"" + ids.entry + "\")]([" +
           subIds[key].map((s) => 'SubResource("' + s + '")').join(", ") + "])");
  }
  L.push("team_declaration = " + q(c.team_declaration));
  L.push("judgment = " + q(c.judgment));
  L.push("portrait_race = " + sn(c.portrait_race));
  L.push("portrait_eye = " + c.portrait_eye);
  L.push("portrait_hair = " + c.portrait_hair);
  L.push("portrait_mouth = " + c.portrait_mouth);
  L.push("portrait_hat = " + c.portrait_hat);
  // 不盖章就**一行都不写**：resume_stamp 的默认值就是 null，
  // 写个空进去反而会让「没填」和「填了空」两种状态看起来不一样。
  if (c.resume_stamp) L.push('resume_stamp = ExtResource("' + ids.stamp + '")');
  return L.join("\n") + "\n";
}

function lineObject(ln) {
  const o = { speaker_name: ln.speaker, text: ln.text };
  if (ln.popup.trim() !== "") o.popup = ln.popup.trim();
  // popup_stamp 只在**这一行真的弹牌子**时写：牌子没亮的话，Godot 侧这个键根本不会被读，
  // 写进去只会让后来的人以为它生效了（和 dialogue_generator.html 同一套取舍）。
  if (ln.popup.trim() !== "" && ln.popupStamp.trim() !== "") o.popup_stamp = ln.popupStamp.trim();
  return o;
}
function jsonText(lines) { return JSON.stringify(lines.map(lineObject), null, "\t") + "\n"; }

/* 这位候选人会写出的全部文件。`loaded = false` 的那几个**不写**：
   它们是 import 出来、台词却没跟过来的 json —— 写出去就是用空台词盖掉人家真写的对话。
   （judgment / 文案之类全在 .tres 里，所以 .tres 永远 loaded。） */
function filesFor(c) {
  const out = [{ name: c.id + ".tres", dir: "candidates", text: buildTres(c), loaded: true }];
  flatEntries(c).forEach((e, i) => out.push({
    name: c.id + "_" + (i + 1) + ".json", dir: "asks", text: jsonText(e.lines),
    loaded: e.linesLoaded !== false,
  }));
  out.push({
    name: c.id + "_status.json", dir: "asks", text: jsonText(c.statusLines),
    loaded: c.statusLoaded !== false,
  });
  return out;
}

// ── 右侧 ────────────────────────────────────────────────────────────────────
function renderSide() {
  const tabs = $("#tabs"); tabs.textContent = "";
  candidates.forEach((c, i) => tabs.appendChild(el("button", {
    className: i === current ? "on" : "",
    textContent: c.id + (c.display_name ? " · " + c.display_name : ""),
    onclick: () => { current = i; render(); },
  })));

  const list = $("#files"); list.textContent = "";
  const out = $("#out");
  if (!candidates.length) { out.textContent = ""; return; }
  const c = candidates[current];
  const files = filesFor(c);
  for (const f of files) {
    const row = el("li", {}, [
      el("span", { textContent: "data/" + f.dir + "/" + f.name }),
      el("button", { className: "tiny", textContent: "看", onclick: () => { out.textContent = f.text; } }),
    ]);
    // 没读进来的 json：不给下载（免得存出一份空台词），写回时也会跳过
    if (f.loaded) row.appendChild(el("button", { className: "tiny", textContent: "下载", onclick: () => download(f.name, f.text) }));
    else row.appendChild(el("span", { className: "warn", textContent: "（台词没读进来 · 写回跳过）" }));
    list.appendChild(row);
  }
  out.textContent = files[0].text;

  const ids = candidates.map((x) => x.id);
  const dup = ids.filter((v, i) => ids.indexOf(v) !== i);
  // 「谁吹了牛」在名字栏里一眼能看到：吹 = 有 true_attributes 这一行
  const liars = candidates.filter(fakedOf).length;
  $("#msg").textContent = dup.length
    ? "⚠ id 重复：" + [...new Set(dup)].join("、")
    : candidates.length + " 位候选人" + (liars ? "（其中 " + liars + " 位在属性上吹了牛）" : "");
  $("#msg").className = dup.length ? "warn" : "ok";
}

/* 这位候选人填了哪几项真实属性（空数组 = 没吹牛，.tres 里不会有 true_attributes） */
function fakedOf(c) {
  return ATTR_KEYS.filter((k) => c.true_attributes[k] !== "");
}

function download(name, text) {
  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  const a = el("a", { href: URL.createObjectURL(blob), download: name });
  document.body.appendChild(a); a.click(); a.remove(); URL.revokeObjectURL(a.href);
}

// ── 动作 ────────────────────────────────────────────────────────────────────
$("#add").onclick = () => { candidates.push(blankCandidate(candidates.length + 1)); current = candidates.length - 1; render(); };
$("#dup").onclick = () => {
  if (!candidates.length) return;
  const copy = JSON.parse(JSON.stringify(candidates[current]));
  copy.id = copy.id + "_copy";
  candidates.push(copy); current = candidates.length - 1; render();
};
$("#del").onclick = () => {
  if (!candidates.length) return;
  candidates.splice(current, 1); current = Math.max(0, current - 1); render();
};
$("#dlOne").onclick = () => {
  if (!candidates.length) return;
  const f = filesFor(candidates[current])[0];
  download(f.name, f.text);
};
$("#dlJson").onclick = () => {
  if (!candidates.length) return;
  let n = 0, skipped = 0;
  for (const f of filesFor(candidates[current])) {
    if (!f.name.endsWith(".json")) continue;
    if (!f.loaded) { skipped++; continue; }
    download(f.name, f.text); n++;
  }
  if (skipped) { $("#msg").textContent = "已下载 " + n + " 个 json（跳过 " + skipped + " 个台词没读进来的）"; $("#msg").className = "warn"; }
};

// ── 读取已存在的候选人 ──────────────────────────────────────────────────────
//
// 两条入口，做的事情一样（读文件 → parseTres → 贴台词 → 塞进标签栏）：
//   · 「读取 .tres / json…」：选文件，任何浏览器都能用。**把同一个人的 ask json 一起选上**
//     才能连台词一起读进来（.tres 里只有路径，台词在 json 里）。
//   · 「从 data/ 读取…」（Chromium）：选 data/ 目录，candidates/*.tres 与 asks/*.json
//     一起读 —— 相当于把整份数据读进来改，写完再「全部写入 data/…」放回去。
// 拖拽文件到页面上 = 第一条入口。

/* 读进来的候选人塞进标签栏。**同 id 就顶掉那一个**，不多开一个同 id 的标签 ——
   两份同 id 摆在标签栏里，点「全部写入」时后一个会静默覆盖前一个，那是最难查的一类事故。 */
function applyImport(imported, note) {
  let first = -1, replaced = 0;
  for (const c of imported) {
    const at = candidates.findIndex((x) => x.id === c.id);
    if (at >= 0) { candidates[at] = c; replaced++; if (first < 0) first = at; }
    else { candidates.push(c); if (first < 0) first = candidates.length - 1; }
  }
  if (first >= 0) current = first;
  render();
  // render() 会顺手把 #msg 刷成「N 位候选人」，所以这句话要**在 render 之后**写
  $("#msg").textContent = (imported.length ? note : "⚠ 没读出候选人") + (replaced ? "（同 id 的标签已顶上）" : "");
  $("#msg").className = imported.length ? (note.indexOf("⚠") >= 0 ? "warn" : "ok") : "warn";
}

/* 一批 {name, text} → 塞进标签栏。tres 是主角，json 是台词。 */
function importFromFiles(files, what) {
  const tres = files.filter((f) => f.name.endsWith(".tres") || f.name.endsWith(".res"));
  if (!tres.length) {
    $("#msg").textContent = "⚠ 没选到 .tres（只认 .tres；同一个人的 ask json 可以一起选）";
    $("#msg").className = "warn";
    return;
  }
  const imported = [];
  for (const t of tres) {
    const c = parseTres(t.text);
    if (c == null) {
      $("#msg").textContent = "⚠ " + t.name + " 不像候选人 .tres（没有 id / display_name / 三项属性）";
      $("#msg").className = "warn";
      continue;
    }
    attachAsks(c, files);          // 名字对得上就贴台词；对不上就留着 false（写回会跳过）
    imported.push(c);
  }
  applyImport(imported, importNote(imported, what));
}

$("#loadFiles").onclick = () => $("#filePicker").click();
$("#filePicker").onchange = async (e) => {
  const files = [];
  for (const f of e.target.files) files.push({ name: f.name, text: await f.text() });
  e.target.value = "";             // 清空：再选同一个文件时 change 还会响
  importFromFiles(files, "已读取");
};

// 拖拽：不用先点按钮再找文件。drop 默认会让浏览器**打开**这个文件，所以要挡掉。
document.addEventListener("dragover", (e) => e.preventDefault());
document.addEventListener("drop", async (e) => {
  if (!e.dataTransfer || !e.dataTransfer.files.length) return;
  e.preventDefault();
  const files = [];
  for (const f of e.dataTransfer.files) files.push({ name: f.name, text: await f.text() });
  importFromFiles(files, "已拖入");
});

// Chromium：一次读整份 data/（candidates/*.tres + asks/*.json）
if (window.showDirectoryPicker) {
  $("#loadDir").hidden = false;
  $("#loadDir").onclick = async () => {
    try {
      const root = await window.showDirectoryPicker({ mode: "readwrite" });   // 还是选 data/
      let asks = [];
      try {
        const askDir = await root.getDirectoryHandle("asks");
        for await (const h of askDir.values()) {
          if (h.kind === "file" && h.name.endsWith(".json")) {
            asks.push({ name: h.name, text: await (await h.getFile()).text() });
          }
        }
      } catch (e) {
        // 没有 asks/ 目录：台词读不进来，下面 importNote 会明说「写回会跳过」
      }
      const imported = [];
      const candDir = await root.getDirectoryHandle("candidates");
      for await (const h of candDir.values()) {
        if (h.kind !== "file" || !h.name.endsWith(".tres")) continue;
        const c = parseTres(await (await h.getFile()).text());
        if (c == null) continue;
        attachAsks(c, asks);
        imported.push(c);
      }
      applyImport(imported, importNote(imported, "已从 data/ 读取"));
    } catch (e) {
      if (e && e.name !== "AbortError") { $("#msg").textContent = "读取失败：" + e.message; $("#msg").className = "warn"; }
    }
  };
}

// Chromium：一次把 data/candidates 与 data/asks 都写好，省掉一个个下载
if (window.showDirectoryPicker) {
  $("#saveDir").hidden = false;
  $("#saveDir").onclick = async () => {
    try {
      const root = await window.showDirectoryPicker({ mode: "readwrite" });   // 选 data/ 目录
      let n = 0, skipped = 0;
      for (const c of candidates) {
        for (const f of filesFor(c)) {
          // 台词没读进来的 json 一律**不碰**：写出去就是用空台词盖掉别人真写的对话（见 filesFor）
          if (!f.loaded) { skipped++; continue; }
          const dir = await root.getDirectoryHandle(f.dir, { create: true });
          const fh = await dir.getFileHandle(f.name, { create: true });
          const w = await fh.createWritable();
          await w.write(f.text); await w.close();
          n++;
        }
      }
      $("#msg").textContent = "已写入 " + n + " 个文件 ✅"
        + (skipped ? "（跳过 " + skipped + " 个台词没读进来的 json）" : "");
      $("#msg").className = skipped ? "warn" : "ok";
    } catch (e) {
      if (e && e.name !== "AbortError") { $("#msg").textContent = "写入失败：" + e.message; $("#msg").className = "warn"; }
    }
  };
}

candidates.push(blankCandidate(1));
render();
</script>
